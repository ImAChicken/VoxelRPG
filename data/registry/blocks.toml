# VoxelRPG Block Registry
# All block types defined here — engine loads this at startup
# id 0 = air, hardcoded, not listed here
#
# Light (the baked light layer):
#   light      = [r, g, b]   what the block gives off, 0-15 per colour
#   light_pass = "clear" | "dim" | "block"   how light gets through it
#                (default from opacity: full blocks it, partial and
#                translucent dim it, none lets it through)
#
# Plants (flags "plant"): the voxels that make up flowers, grass
# tufts, ferns, reeds and mushrooms. They are not solid (you walk
# through them), break instantly, and are never items themselves:
# breaking one picks up the whole plant it belongs to (see
# decorations.toml). Opacity "full" only so the mesher can hide the
# faces between them; light_pass "clear" lets light straight through.

