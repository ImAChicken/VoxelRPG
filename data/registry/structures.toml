# VoxelRPG Structure Registry
# Multi-block structures that exist as ONE object in the world
# (a structure instance): building pieces, doors and trees.
# Scale: 1 voxel = 4 inches, so 3 voxels = 1 ft, 12 voxels = 4 ft.
# F6 reloads this file.
#
# kind:     build | door | tree | spawner | chest | station
# menu:     true = listed in the Builder's Hammer build menu
# block:    what a build piece / door is made of
# size:     [width, height, depth] in voxels
# hole:     [x, y, z, width, height, depth] cut out of a build piece
# snap:     while following the crosshair, line the piece up on
#           this grid (foundations line up with each other instead)
# foundation:    true = rests on the ground and holds others up;
#                it may sink into earth / stone (not wood or
#                other structures), so it can level uneven ground
# needs_support: true = in Survival it must touch a foundation or
#                a piece already standing on one
# cost:     what Survival placement uses up (refunded on removal)
# health / drop / drop_count: trees — chops take health away,
#           at 0 the whole tree falls and drops this
# slots:    storage, any kind (chests: 50 unless set; others: none).
#           E opens it beside your inventory
# loot:     a loot table (loot.toml) rolled the first time one is
#           opened or broken. One built with the Builder's Hammer
#           starts empty; one placed by a command or a world rolls.
#           Setting loot gives 50 slots unless 'slots' says
#
# A shape can also be drawn (any kind but trees and doors):
#   legend = { c = "cobblestone", f = "fire" }    one character → a block
#                                                 ('.' and ' ' are air)
#   layers = [ [ "rows", ... ], { rows = [ ... ], repeat = 6 }, ... ]
#            bottom layer first; in a layer the rows run along z,
#            the characters along x. Rows can be shorter than others.
#   anchor = [x, y, z]   the voxel placed where you aim (default: the
#            bottom centre; build pieces: the corner)

# ── Parts (building, blueprints, villages) ────────────────
# part:     what the piece is (foundation, wall, wall_door,
#           wall_window, gable, floor, roof, pillar, beam, stairs,
#           door, station, furniture, light). Its group is the part
#           up to the first '_' (wall_door → wall)
# materials = { plank = "planks", stone = "cobblestone" }
#           one entry, one type per material: {m} in the name (and
#           {M} in the display) becomes the material, "$" in a
#           legend is its block. Types that differ only by material
#           are one family, so a blueprint can swap one for another
#           (all plank walls → stone walls)
# family:   set it to join an entry that isn't a {m} template to a
#           family (the 8 ft foundation keeps its old name)
# tags:     anything else, for generators: tags = ["village"]
#
# Shapes made from a size (no drawing needed):
#   shape = "slope"   roof plane rising along z; size [width, rise, run],
#                     thickness (2)
#   shape = "gable"   the triangle under a roof's end; size [span,
#                     height, thickness], inset (2) below the roof planes
#   shape = "stairs"  solid steps rising along z; size [width, rise,
#                     run], step (3)
#
# Stations (kind "station"): station = "workbench", title = "Workbench".
# E opens their menu (a placeholder for now).
#
# costs:    false = building is free for everyone (the hammer charges
#           nothing, removing refunds nothing). The cost lists stay so
#           turning this on brings them back
costs = false

# ── Building pieces ───────────────────────────────────────
# Sizes: 1 ft = 3 voxels. Everything is on a 2 ft (6 voxel) module.
#   foundations  2, 4, 6, 8 and 10 ft square, 4 ft deep
#   walls        10 ft tall (good headroom under a ceiling), 8 in
#                thick, 2 / 4 / 8 ft wide; doorways 3 ft 4 in x 8 ft
#   floors       8 in thick, sit on top of walls as ceilings / lofts
#   roofs        45 degrees, 4 or 8 ft along the ridge, running 4 to
#                10 ft from eave to ridge (half the house's width)
#
# Foundations rest on the ground and hold others up. One within 4 ft
# of another must line up with it on the 2 ft module (side by side,
# edges flush, or stacked). They sink into earth and stone to level
# uneven ground.
[[structure]]
name = "{m}_foundation_2"
display = "{M} Foundation 2 ft"
part = "foundation"
materials = { stone = "stone", slate = "slate" }
kind = "build"
menu = true
size = [6, 12, 6]
foundation = true
cost = { stone = 6 }

