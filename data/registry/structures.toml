# ── Arched and church openings (shape = "wall", arch = true) ──
# arch = true rounds the opening's top into a half circle (a door in
# an arched doorway fills it up to where the arch springs). glazing =
# "mosaic": stained glass in diamonds of red, blue, amber and green
# with a stone mullion and a transom at the arch; the palette's glass
# leads the pattern. Plain finish: they take the palette's (a church
# palette gives a stone plinth outside, whitewash in).
[[structure]]
name = "{m}_arched_window_8"
