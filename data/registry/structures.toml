# ── Exterior walls (shape = "wall": StructureRegistry::wallModel) ──
# Three voxels thick (an outside face, the core, an inside face), so
# the outside can carry frames and inlays and the inside its own
# finish. The hammer turns the outside away from the foundation they
# stand on (turn the piece to swap). Same 4 / 8 ft widths and 10 ft
# height as the plain walls (those stay 2 thick: inner walls).
#   outside  timber | plinth | inlay | frame | plain
#   inside   paint | panel | plain
#   opening  door (10 x 24 through it, framed both faces, a lintel; a
#            door piece fits) | window (framed both faces, a cross
#            outside, 'glass' set back in the core)
#   post / beam / base / panel / paint / inlay / glass: the blocks
#            (defaults timber_post, timber_beam, stone_bricks, wainscot,
