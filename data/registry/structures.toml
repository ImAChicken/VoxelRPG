# ── Spawners (sim/Spawners.h) ─────────────────────────────
# A structure that keeps NPCs coming while a player is near. Placed
# by hand: dev menu → Structures (Builder's Hammer), or the console
# (place <name>). Remove it with the hammer like any piece; its NPCs
# stay. The debug overlay's ai layer shows its radius and count.
#
# spawn = {
#   npcs = { <npcs.toml type> = weight, ... }   what it makes
#   max_alive = 3      alive at once (it fills up when it first wakes)
#   total = 0          ever (0 = no limit)
#   radius = 10        voxels around it they appear in
#   activate = 96      only works while a player is this close
#   respawn = 30       s after one is gone before the next appears
#   min_player_distance = 12   never appear this close to a player
#   home = true        they live around it (home, patrol, territory)
# }

[[structure]]
name = "bandit_camp"
display = "Bandit Camp"
kind = "spawner"
legend = { c = "cobblestone", x = "charred_log", f = "fire", d = "dark_log", r = "maple_leaves_red" }
layers = [
  [ ".......", ".ccccc.", ".c...c.", ".c.x.c.", ".c...c.", ".ccccc.", "......d" ],
  [ ".......", ".......", ".......", "...f...", ".......", ".......", "......d" ],
  { rows = [ "", "", "", "", "", "", "......d" ], repeat = 7 },
  { rows = [ "", "", "", "", "", "", "...rrrd" ], repeat = 4 },
  [ "", "", "", "", "", "", "......d" ],
]
spawn = { npcs = { bandit = 1 }, max_alive = 3, radius = 14, activate = 96, respawn = 45, min_player_distance = 16 }

