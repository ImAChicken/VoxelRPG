# VoxelRPG Structure Registry
# Multi-block structures that exist as ONE object in the world
# (a structure instance): building pieces, doors and trees.
# Scale: 1 voxel = 4 inches, so 3 voxels = 1 ft, 12 voxels = 4 ft.
# F6 reloads this file.
#
# kind:     build | door | tree
# menu:     true = listed in the Builder's Hammer build menu
# block:    what a build piece / door is made of
# size:     [width, height, depth] in voxels
# hole:     [x, y, z, width, height, depth] cut out of a build piece
# snap:     while following the crosshair, line the piece up on
#           this grid (foundations snap to the 4 ft grid)
# foundation:    true = rests on the ground and holds others up;
#                it may sink into earth / stone (not wood or
#                other structures), so it can level uneven ground
# needs_support: true = in Survival it must touch a foundation or
#                a piece already standing on one
# cost:     what Survival placement uses up (refunded on removal)
# health / drop / drop_count: trees — chops take health away,
#           at 0 the whole tree falls and drops this

# ── Building pieces ───────────────────────────────────────
[[structure]]
name = "foundation"
display = "Stone Foundation"
kind = "build"
menu = true
block = "stone"
size = [12, 12, 12]
snap = 12
foundation = true
cost = { stone = 32 }

