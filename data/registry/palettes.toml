# ══════════════════════════════════════════════════════════
# Building palettes (game/Palettes.h)
# ══════════════════════════════════════════════════════════
# A palette is what a building is made of: a block for each role of
# a made piece (walls, posts and doors: structures.toml shape =
# "wall" / "pillar", kind = "door") and a finish for plain walls.
# The Builder's Hammer equips one (build menu, Palettes tab), and a
# village dresses all its buildings in one.
#
# Roles:
#   fill    the wall itself (its core)
#   post    upright timbers on the outside; a post's shaft
#   beam    rails, sills, frames and trim; a post's cap; a door's ledges
#   base    the stone plinth under a wall; a post's foot
#   inlay   the diamonds in an inlaid wall's band
#   paint   the inside face
#   panel   the boards below the inside rail
#   glass   window glass ("none": open)
#   door    door boards
#   roof    roof slopes (thatch, tiles, slate)
#   floor   floors and ceilings
# Finish (plain walls only: the timber, plinth and inlay walls keep
# their own, in the palette's blocks):
#   outside  plain | timber | plinth | inlay | frame
#   inside   plain | paint | panel
#
# A player's own palettes and edits are saved to data/palettes/
# (Reset in the menu deletes the edit: this file's palette is back).

# What the palette editor offers for each role, in order
[choices]
fill  = ["whitewash", "plaster", "ochre_plaster", "planks", "dark_planks", "fieldstone", "cobblestone",
         "stone_bricks", "bricks", "limestone", "sandstone_cream", "sandstone_red", "slate", "mud"]
post  = ["timber_post", "dark_log", "log_y", "birch_log", "stone_bricks", "fieldstone", "limestone",
         "sandstone_red", "slate"]
beam  = ["timber_beam", "dark_planks", "planks", "stone_bricks", "limestone", "sandstone_orange", "slate"]
base  = ["fieldstone", "stone_bricks", "cobblestone", "limestone", "slate", "sandstone_red", "bricks"]
inlay = ["herringbone_bricks", "bricks", "slate", "roof_tiles", "stone_bricks", "dark_planks", "ochre_plaster"]
paint = ["plaster", "whitewash", "ochre_plaster", "wainscot", "planks", "dark_planks", "stone_bricks"]
panel = ["wainscot", "dark_planks", "planks", "stone_bricks", "fieldstone"]
glass = ["leaded_glass", "glass", "stained_glass_amber", "stained_glass_red", "stained_glass_green", "stained_glass_blue", "none"]
door  = ["dark_planks", "planks", "wainscot", "timber_beam"]
roof  = ["thatch", "roof_tiles", "slate", "dark_planks", "planks"]
floor = ["planks", "dark_planks", "herringbone_bricks", "stone_bricks", "slate", "fieldstone", "limestone", "sandstone_cream"]

