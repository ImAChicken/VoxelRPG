# ── The axe: a TOOL, not a weapon ────────────────────────
# Lives in the toolbar, never the weapon slot, and is not used in
# the combat stance. While it is the held toolbar item the camera
# goes to third person, and left click swings it, Valheim style:
# a wind-up over the right shoulder and a diagonal chop (see
# game/AxeSwing.h). The blade's path is traced through the world
# and its speed when it lands sets the damage, up to tool_power.
#   trees   take damage; at 0 the tree falls over as one heavy
#           piece, its leaves break off, and it lies as a log
#   logs    take damage too; each hit drops a share of the tree's
#           wood on the ground; the last hit breaks the log up
#   other   blocks stop the blade (a thunk) but are not harmed
# Right click does nothing with it.
[[item]]
id = 1030
name = "iron_axe"
weight = 2.5              # kg
categories = ["tool"]
tool = "axe"
tool_power = 6.0          # damage of a full-speed chop (an oak has 40); also what it does to a body
poise_damage = 20         # poise damage of a full-speed chop on a body
damage_type = "slash"
held_model = "axe"        # drawn in the hand: data/models/held/axe.vxm
# As a weapon: it can go in a weapon slot (inventory, I) and fights
# with the axe moveset when drawn (R). In the hotbar it stays a tool.
moveset = "axe"
damage = 9
color = [0.75, 0.70, 0.65]

# ── Weapons ───────────────────────────────────────────────
# A weapon fights; it doesn't work the world. Wielded from the
# weapon slot (Survival: R draws it, the combat stance) or held
# in the toolbar (any mode with a body, e.g. Test Play). Either
# way the camera goes to third person and the mouse fights
# instead of building (game/Combat.h):
# Fields: moveset (movesets.toml: timing, reach, poise damage…),
# damage (a light hit), damage_type (slash / pierce / blunt),
# weight (heavier than the moveset's ref_weight: slower, dearer,
# harder on poise), held_model (data/models/held/<name>.vxm).
#   left click     light attack (press again in time: the combo)
#   right click    heavy attack (slow, knocks down)
#   in the air     light: lurch forward / heavy: plunge and slam
#   Q (hold)       guard: blocks most damage from the front, at
#                  the cost of stamina
# Every attack, roll and dodge costs stamina. 'damage' is a hit
# from a light attack; the others multiply it. Enemies with a
# weapon use the same moves.
[[item]]
id = 1100
name = "iron_sword"
weight = 1.5              # kg
categories = ["weapon"]
weapon_class = "sword"
moveset = "sword"         # how it fights (movesets.toml)
damage = 12.0             # a light hit; the moveset's attacks multiply it
damage_type = "slash"
held_model = "sword"      # drawn in the hand: data/models/held/sword.vxm
color = [0.85, 0.85, 0.90]

[[item]]
id = 1101
