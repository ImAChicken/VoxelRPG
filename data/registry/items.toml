# VoxelRPG Item Registry
# Every block in blocks.toml is an item automatically (same ID).
# This file adds everything else. IDs 1000 and up only.
#
# categories:  block, tool, weapon, dev  (an item may have several)
# tool:        pickaxe | shovel | axe | hoe      (digging tools)
#              hammer: the Builder's Hammer (build menu + placing structures)
# tool_power:  dig speed multiplier on blocks the tool suits
#              pickaxe → stone, shovel → dirt, axe → wood, hoe → organic
# cube:        pickaxes: breaks a cube this many voxels wide in one go,
#              lined up on a grid of that size (hold Shift for off-grid)
# weapon_class / damage: used in the combat stance only
# held_model:  what is drawn in the hand: "axe" (character/HeldItemModel.h)
# dev_tool:    wand | fill | replace | brush | copy | paste | explode | breaker | cube
# color:       swatch shown in menus until items have icons
# weight:      kg, for one of the item. Counts toward the body's mass
#              when worn, held, or carried in the weapon slot (on the
#              back when sheathed). Heavier bodies take less knockback,
#              and weight in the hand slows that arm's recovery.
# worn:        head | torso | hands | legs | feet | back
#              gear worn on that part of the body (console: wear <item>)
# accessory:   ring | amulet   goes in the Ring / Amulet equipment slots
#              (none exist yet)
# No recompile needed after editing — F6 reloads blocks and items.

# ── Player tools ──────────────────────────────────────────
[[item]]
id = 1000
name = "wooden_pickaxe"
weight = 1.5              # kg
categories = ["tool"]
tool = "pickaxe"
cube = 6                 # 24 inch (2 ft) cube
