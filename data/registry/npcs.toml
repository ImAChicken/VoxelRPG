# ══════════════════════════════════════════════════════════
# NPC types (npc/NpcTypes.h)
# ══════════════════════════════════════════════════════════
# An NPC is a Human like the player — same body, physics,
# ragdoll, moveset — driven by a brain instead of a keyboard.
# A type says which faction it's in, how it looks, what it
# carries, how it senses, and which STATES its brain may use.
# Spawn one with: spawn <type> [count]
#
#   name            shown over its head
#   faction         factions.toml
#   look            appearance preset (data/characters/presets.toml)
#   weapon          item it fights with (its moveset comes from the item)
#   health, poise   its toughness
#   climb           how much slopes slow it (default 1; 0.2 a goat, 1.5 a
#                   heavy brute); its paths weigh climbing the same way
#   states          the brain states it may use (npc/Brain.h); a
#                   state it doesn't have is skipped (no patrol →
#                   it idles instead). "dead" is always there.
#                   Built in: idle, unavailable, patrol, alert,
#                   combat, search, return, flee, dead
#   start           the state it starts in (default: idle, or
#                   patrol if it has one)
#   idle            "stand" (stays put, faces where it was put)
#                   or "wander" (strolls about home)
#   wander_radius   how far it strolls from home
#   territory       radius: its patrol area around home;
#                   leash: how far it chases before giving up
#                   and going back (left out: no limit)
#   patrol_points   waypoints made around home for its patrol
#   sight           range (voxels) and fov (degrees)
#   hearing         × how far it hears noises
#   alert_time      [min, max] s it spends deciding when it first
#                   sees an enemy
#   battle_cry      range (voxels) and cooldown (s); left out: none
#   slots           preferred places around its target in a fight,
#                   best first (front, rear_flank, left, right,
#                   front_left, front_right, rear_left, rear_right, ring)
#   aggression      0..1: how often it attacks when it may (it
#                   also needs an attack token: npc/Encounters.h)
#   tracks          true: having lost you, follows your trail of
#                   breadcrumbs (where you actually went)
#   xp              for killing it (default: health / 4), shared
#                   by the players in the encounter
#   on_menu_attack  "interrupt" (drops the menu and reacts) or
#                   "protected" (ignores attacks while in a menu)
#   pack            slots it carries (default: 20 with a loot
#                   table, else none). E on its body searches it
#   wear            worn items it shows (items.toml, ones with gear)
#   loot            a loot table (loot.toml) its pack is rolled
#                   from the first time it's searched. A body that
#                   may hold something stays 5 minutes (else 20 s)

[[npc]]
id = "bandit"
name = "Bandit"
faction = "bandits"
look = "bandit"
weapon = "iron_sword"
loot = "bandit"
wear = ["leather_jerkin"]
health = 100
poise = 35
states = ["idle", "patrol", "alert", "combat", "search", "return", "dead"]
idle = "stand"
territory = { radius = 60, leash = 160 }
patrol_points = 4
sight = { range = 70, fov = 140 }
hearing = 1.0
alert_time = [0.6, 1.2]
battle_cry = { range = 90, cooldown = 20 }
slots = ["front", "rear_flank", "left", "right"]
aggression = 0.75
on_menu_attack = "interrupt"

