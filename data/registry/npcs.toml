[[npc]]
# The crypt's archers: bones on a person's frame (presets.toml
# "skeleton"). They keep their distance and shoot (style "ranged"):
# a long draw is the telegraph (roll it, guard it, or get behind
# something); get close and they back off, and pinned against a wall
# they pull a dagger.
id = "skeleton_archer"
name = "Skeleton Archer"
faction = "undead"
look = "skeleton"
weapon = "short_bow"
sidearm = "bone_dagger"
loot = "undead"
health = 55
poise = 18
states = ["idle", "alert", "combat", "search", "dead"]
idle = "wander"
wander_radius = 8
sight = { range = 90, fov = 140 }
hearing = 1.4
alert_time = [0.5, 1.0]
style = "ranged"
range = [24, 75]           # vox from its target it shoots from
draw = [0.9, 1.5]          # s it holds the draw (1.5: a full draw, it stumbles)
shot_gap = [0.9, 2.0]      # s between shots
slots = ["ring"]           # never takes a place in the melee
read_chance = 0.3
turn_speed = 360
aggression = 0.8
voice = { pitch = 0.3, range = 0.2, size = 0.4, speed = 0.5, breath = 0.8, rough = 0.6, nasal = 0.3, style = "grunty", volume = 0.6 }
barks = { spot = ["Hhhssss..."], hurt = ["Khk!"], die = ["Hhaaa..."] }

[[npc]]
# The crypt's boss (docs/dungeons.md step 5): a giant of the dead
# (look crypt_lord: 1.6 times a person, every way), with a greatsword.
# Style "boss" (npc/States.h Combat::bossFight): it picks its move by
# how far you are: wide sweeps up close, the slam and its shockwave a
# little further, a charge from afar. Armour shrugs off flinches and
# stumbles: only a poise break staggers it. At half health (phase =
# 0.5) it roars, the arena's phase-two coffins open, and it fights
# faster (phase_speed). A health bar shows while you fight it (boss).
id = "crypt_lord"
name = "Crypt Lord"
faction = "undead"
look = "crypt_lord"
weapon = "crypt_greatsword"
loot = "undead"
health = 900
poise = 140
armor = 2
boss = true
states = ["idle", "alert", "combat", "search", "dead"]
idle = "stand"
sight = { range = 120, fov = 200 }
hearing = 2.0
alert_time = [0.3, 0.6]
style = "boss"
phase = 0.5
phase_speed = 1.25
read_chance = 0.3
turn_speed = 200
aggression = 0.95
voice = { pitch = 0.04, range = 0.15, size = 1.0, speed = 0.25, breath = 0.7, rough = 0.95, nasal = 0.0, style = "grunty", volume = 1.0 }
barks = { spot = ["You... will join them..."], hurt = ["Hrrkh!"], die = ["No... rest..."], phase = ["ENOUGH! Rise, my dead!"] }

