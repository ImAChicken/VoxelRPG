# ══════════════════════════════════════════════════════════
# Spells (game/Spells.h; what they do: sim/SpellSystem.h)
# ══════════════════════════════════════════════════════════
# A spell is parts put together; new spells need no code. A spellbook
# (items.toml spell = "<id>") casts one from a combat slot (X / Y / B,
# keys 1-3 in combat) or the off hand (LT / Q); NPCs cast them too
# (npcs.toml casts = [...], or a monster's swing with spell = "<id>").
# Console: `cast <id>` casts one where you look, `spells` lists them.
# F6 reloads this file.
#
#   id, name
#   school     fire | frost | shock | arcane | wind | nature: its damage
#              type unless an effect says, and its look by default
#   delivery   how it gets there:
#                self        on you (heals, wards, a blink)
#                touch       the nearest enemy in front, within range
#                            (at most 9) and arc
#                cone        everyone in front, within range and arc
#                            (effects fall off toward the edge)
#                projectile  bolts: speed, gravity, homing (deg/s),
#                            count fanned by spread (deg), bounces off
#                            walls, pierce (bodies it goes through),
#                            assist (deg: turns toward an enemy near
#                            its line)
#                beam        straight along your aim to range, the
#                            first body it meets (pierce: more)
#                area        a circle (radius) out where you aim, up to
#                            range (at = "self": round you); goes off
#                            every 'every' s for 'duration' s (0: once)
#                wall        range out, across your way: 'place' (a
#                            structure, kind "effect", gone after its
#                            lifetime) and/or its effects in a strip
#                            width long
#                rune        laid where you aim (range); armed after a
#                            moment, the first enemy within radius sets
#                            it off: its on_hit spell, or its effects
#                            round it. Gone after duration (60)
#                summon      'count' of an npcs.toml type ('summon')
#                            that fight for you for 'duration' s
#   use        how the button works:
#                tap      quick (cast_time 0.08)
#                cast     a wind-up (cast_time), then it goes
#                charge   held at the end of the wind-up to power it
#                         up, up to charge_time s; a full charge ×
#                         charge_power to its effects
#                channel  held: the delivery again every 'every' s,
#                         draining cost.drain stamina a second, for up
#                         to 'duration' s
#                toggle   an aura: on (its effects round you every
#                         'every' s within radius, draining cost.drain
#                         a second) until you cast it again or run out
#   when       where it can be cast: ground, air, sprinting, grappling
#              (mid-pull: game/Grapple.h), rolling (default: ground, air)
#   hands      1 (the other hand keeps its weapon or shield) or 2
#   anim       the cast pose (anim_map.toml [casts]): push, overhead,
#              slam, self, throw, channel, sweep, place
#   tags       free words other things find spells by (skill trees,
#              items, resistances): fire, projectile, aerial, grapple…
#   targets    enemies (default), allies, all, self (default for self)
#   cost       { stamina, cooldown (s), drain (stamina/s) }
#   cast_time, recover   s before it goes, s after
#   effects    a list, each { kind, … }:
#                damage   amount, type (default: its school)
#                push     amount (vox/s), lift (share up); pull: toward
#                poise    amount, knockdown (a break knocks down)
#                status   status = burn | slow | freeze | poison |
#                         silence | haste, time (s), amount (burn,
#                         poison: damage a second; slow, haste: 0-1)
#                heal     amount        ward    amount (soaks damage), time
#                place    structure (set down where it lands)
#                blink    amount (vox forward)
#                light    time (a flash of light)
#              falloff (cone, area): what's left at the edge (1: all)
#   on_hit, on_expire   a spell cast from where it hit / ended
#              (spells chain; at most 4 deep)
#   look       { color = [r, g, b], cast, trail, hit, tick (particles
#              .toml emitters; default spell_<school>_cast / _trail /
#              _hit / _tick) }
# Mana doesn't exist yet: everything costs stamina for now.

# ── Wind ──────────────────────────────────────────────────
[[spell]]
id = "windburst"
name = "Windburst"
school = "wind"
delivery = "cone"
use = "cast"
anim = "push"
hands = 2
tags = ["wind", "cone", "push", "control"]
cost = { stamina = 25 }
cast_time = 0.32
recover = 0.48
range = 24
arc = 50
effects = [
  { kind = "poise", amount = 40, falloff = 0.25, knockdown = true },
  { kind = "push", amount = 46, lift = 0.25, falloff = 0.4 },
]
look = { color = [0.75, 0.95, 1.0] }

# ── Frost ─────────────────────────────────────────────────
# Leaves ice where it meets the ground (structures.toml ice_spike,
# melts after 15 s)
[[spell]]
id = "ice_spike"
name = "Ice Spike"
school = "frost"
delivery = "projectile"
use = "cast"
anim = "push"
tags = ["frost", "projectile", "terrain"]
cost = { stamina = 20 }
cast_time = 0.30
recover = 0.40
range = 90
speed = 70
gravity = 22
assist = 12
effects = [
  { kind = "damage", amount = 18 },
  { kind = "poise", amount = 20 },
  { kind = "push", amount = 14, lift = 0.25 },
  { kind = "status", status = "slow", amount = 0.3, time = 2 },
  { kind = "place", structure = "ice_spike" },
]
look = { color = [0.72, 0.90, 1.0] }

