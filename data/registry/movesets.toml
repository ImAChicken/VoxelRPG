# ══════════════════════════════════════════════════════════
# Movesets — how each kind of weapon (or tool) fights
# ══════════════════════════════════════════════════════════
# A weapon item names its moveset (items.toml: moveset = "sword").
# Every body that holds it — the player, an enemy — attacks with
# these, through the same code (game/Combat.h, CombatMoves.h,
# CombatHits.h). Reloaded with F6.
#
# A moveset lists which attack goes in each slot:
#   light       the light chain, in order; pressing light again
#               during a swing goes to the next one (and back to
#               the first after the last)
#   heavy       right click on the ground
#   air_light   left click in the air (lurches forward)
#   air_heavy   right click in the air (hangs, plunges, slams)
# A slot left out: that attack doesn't exist for this weapon.
#
#   ref_weight  kg the numbers below are tuned for. A heavier
#               weapon of this moveset swings slower, costs more
#               stamina and breaks poise faster; a lighter one
#               the other way (see Combat.h: WeightScales)
#
# Each attack ([[attack]], referred to by id):
#   pose          the keyed pose it plays (combatanim in
#                 Combat.h; later an animation clip)
#   duration      s, wind-up + hit window + recovery
#   active        [from, to] s: the hit window: the only time the
#                 blade can hit. With an animation clip, the clip's
#                 marked strike plays across exactly this window
#                 (data/animations/anim_map.toml 'strike')
#   damage        × the weapon's damage
#   poise         poise damage (× the weapon's weight scale)
#   stamina       cost
#   (A weapon with a voxel model hits with its voxels, swung by
#   the animated arm, against the target's limbs: game/
#   CombatHits.h. reach, arc and band below then only tell NPCs
#   when to swing, and stand in for hits with no posed blade:
#   the plunge's slam, far bodies, unarmed.)
#   reach         voxels from the body's middle line
#   arc           [from, to] degrees around the facing, positive
#                 to the left, swept across the hit window
#                 ([-180, 180]: all around)
#   band          [low, high] voxels above the feet it can hit
#   knock         vox/s the hit gives the target's ragdoll when it
#                 staggers (more if it knocks down)
#   lift          share of the knock that goes upward
#   knockdown     a poise break from this attack knocks down
#                 (otherwise it staggers)
#   lunge         vox/s forward during lunge_time [from, to] (old: step below)
#   step          root motion: voxels the attack carries the body over
#                 lunge_time, fast at first, stopping sharply (step_curve:
#                 higher is sharper, default 1.5). With a target in front
#                 it stretches or shortens (up to 1.6x) to stop just inside
#                 its reach; while winding up the swing turns toward the
#                 target at up to 'track' deg/s (default 720), locked from
#                 the hit window on
#   react         what a hit does to a body that reacts to it (DMC
#                 style: a regular enemy reacts to every hit):
#                 "flinch" (a light's default), "stumble" (a heavy's:
#                 driven back), "launch" (thrown up; hits in the air
#                 keep it up, up to 5), "slam" (an air heavy's: driven
#                 into the ground, bounces; on the ground it falls),
#                 "knockdown" (the ragdoll). A full charge makes a
#                 flinch a stumble, a stumble a launch. A body only
#                 reacts to what beats its armor (npcs.toml); poise
#                 still wears down, and breaking it staggers (or knocks
#                 down, with knockdown = true)
#   hitstun       s the body is stuck reacting (default by reaction:
#                 flinch 0.38, stumble 0.65, launch 0.9, slam 0.8;
#                 a player 0.65x). Knocked into a wall: pinned 0.6 s
#   hits          [[from, to], …]: several hit windows in one swing
#                 (a spin, a double thrust); each can hit the same
#                 body again. Replaces active
#   hitstop       s both bodies hold still when it hits (default 0.07 a
#                 light, 0.13 a heavy; less on a block; more charged)
#   charge        [at, time]: held, the wind-up waits at 'at' s for up to
#                 'time' s; a full charge does charge_damage x damage and
#                 charge_poise x poise (default 1.6 each), stops longer
#                 and shoves further
#   combo_from    s: a queued light press starts the next swing
#                 from here (left out: doesn't chain)
#   track         deg/s it turns while winding up (default 720)
#   cancel_from   s: a dodge can cancel it from here (a light: also any
#                 time outside its hit window; a heavy is committed)
#   armor_from    s: from here to the end of the hit window the
#                 attacker's own poise can't be broken (hyper
#                 armour; left out: none)

