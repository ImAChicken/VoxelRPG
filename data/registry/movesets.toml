# ── Spells: an item's own attack (items.toml: cast = "...") ─
# effect   what happens as the active window opens, instead of a
#          blade hit (sim/Simulation.h castEffects):
#            windburst  a cone of wind: bodies in it are thrown
#                       back, harder the closer; it hits poise
#                       too, so a body low on poise is knocked down
#            ice_spike  a projectile from the chest along the facing
#                       (or at an enemy within 12 degrees of it): a
#                       body it meets takes effect_damage,
#                       effect_poise and effect_knock; where it meets
#                       the ground it leaves effect_place (a
#                       structure: ice that melts)
# effect_range  voxels (a projectile: how far it flies);  effect_arc
#               half-angle, degrees
# effect_speed, effect_gravity  a projectile's flight (vox/s, vox/s²)
