# ── Bow: arrows (effect = "arrow", sim/Simulation.h shoot) ─
# The arrow leaves as the hit window opens: a player shoots along
# where the crosshair is, an NPC at its target, leading it. damage ×
# the bow's damage, poise and react as a swing's; the heavy's charge
# is the draw: speed (from 55% to full effect_speed), reach
# (effect_range from 60%), damage and poise all grow with it, and a
# full draw makes the flinch a stumble. A dodge cancels the draw
# (cancel_from = 0). A rolling body the arrow passes through; a
# guard facing it stops it; the world keeps it stuck a while.
