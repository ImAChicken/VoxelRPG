# Particles (render/Particles.h): each [[emitter]] is one burst.
# The game fires them by id; the ids below are the ones it uses (a
# missing one just doesn't show). Try one in game: "particle <id>".
# F5 (reload data) picks up changes.
#
#   count       [min, max] particles per burst
#   speed       [min, max] vox/s, thrown along the burst's direction
#   spread      degrees around that direction (180: every way)
#   up          vox/s added upward
#   gravity     vox/s² pulling down (negative: drifts up)
#   drag        1/s: how fast they slow
#   life        [min, max] s
#   size        [start, end] vox (each particle ±25%)
#   shape       "puff" (a square facing you) or "spark" (a streak
#               along its motion, 'stretch' s of its speed long)
#   color       [r, g, b, a] at the start; color_end at the end (the
#               default: the same, faded out). Above 1 glows brighter
#               on additive ones
#   color_vary  [r, g, b] ± per particle
#   additive    true: adds light (sparks, flashes), false: laid over
#   bounce      true: stops on the ground instead of falling through
#   jitter      vox: how far from the point each one starts
#
# Fired by:
#   hit_spark, hit_puff   a hit on a body (at the blade's contact,
#                         thrown away from the attacker; a heavy: more)
#   hit_slime             … on a slime
#   block_sparks          a blocked hit on a blade, and with a parry
#   block_wood            … on a shield
#   parry_flash           a parry
#   guard_break           the guard broken
#   poise_break           poise broken (a stagger or knockdown)
#   death_dust            someone killed; death_slime a slime
#   step_dust             an attack's step pushing off (steps of 6+)
#   dodge_dust            a roll or backstep
#   land_dust             a hard landing (more the faster the fall), and
#                         under a body launched off the ground
#   impact_flash          every hit that lands (bigger for a bigger
#                         reaction or a charged hit)
#   wall_dust             a body knocked into a wall and pinned (or
#                         driven into the ground by a slam)
#   perfect_dodge         a perfect dodge, round the dodger

