# VoxelRPG Decorations
# Everything that dresses the ground: plants, bushes and logs,
# ground patches and landmarks. Loaded at startup and with F6
# (new worlds and reloaded worlds pick up changes).
#
# Every entry:
#   name        unique key (also the item name)
#   display     name in menus (default: from the name)
#   recipe      what builds its shape (see below)
#   blocks      the blocks the recipe uses, in the recipe's order
#   height      [min, max] voxels, where the recipe uses a height
#   size        1, 2, 3 … a bigger version, where the recipe has one
#   biomes      { biome = chance } — per square of the layer's grid
#               (biome names: plains, grassland, shrubland, forest,
#               dense_forest, swamp, marsh, riparian, beach, swamp_beach,
#               marsh_beach, sea_cliffs, foothills, low_mountain,
#               mid_mountain, high_mountain, plateau, peak, karst,
#               canyons, autumn_uplands, ashlands (around lava lakes),
#               canyon_mesa (between the two canyons),
#               highland_moor, roadside, plains_lake,
#               forest_lake, mountain_lake, low_mountain_lake,
#               swamp_shallows, hot_spring …)
#   on          ground blocks it grows on (default grass)
#   water       "dry" (default) | "shore" (near water) |
#               "shallow" (standing in 1-3 voxels of water) |
#               "surface" (floating on water 2+ deep)
#   slope       steepest ground, rise per voxel (default 1)
#   patch       0..1 how much it clumps into drifts (0 = even)
#   patch_size  size of the drifts, voxels
#
# [[plant]]  one per 4 × 4 voxels at most, within a 3 × 3 footprint.
#            recipe "sprite": a flat crossed picture like Minecraft's
#            flowers (blocks with render = "sprite"), as tall as the
#            height rolled; the rest are built from voxels.
#            Made of "plant" blocks: walk-through; breaking any part
#            picks up the whole plant as an item.
#            recipes: tuft, tall_grass, flower (stem, head, [leaf]),
#            fern, reed (stalk, [head]), lily (pad, [flower]),
#            mushroom (cap, stem), cushion (body, [accent]), pebble
# [[decor]]  one per 10 × 10 voxels: bush (leaves, [accent]), log
#            (along x, along z, [leaves]), stones (body, [top]), thorn
#            (twigs, [accent]), shard, vent (rim, glow, [crust])
# [[ground]] patches of another top block, shaped by noise; the
#            biome number is roughly how much ground it covers
# [[tree]]   trees that grow in place of some of the usual ones:
#            biomes = { biome = share } — the share of that biome's
#            trees that are this one. recipes: willow, twisted_oak,
#            maple (trunk, leaves, [more leaves]), cypress, mangrove
#            (trunk, leaves, [hanging moss]); water = "shallow" lets a
#            swamp tree stand in shallow water. scale = overall size;
#            twist = how crooked a twisted_oak is (0 straight … 1);
#            replaces = "oak_tree" grows wherever that built-in tree
#            would. Chop them like any tree.
# [[landmark]] one per 256 × 256 voxels at most: willow (trunk,
#            leaves), standing_stones, stone_circle, cairn.
#            spawn = true: always grows beside the world spawn.
#            meadow = radius of flowers around it (meadow_plants).

