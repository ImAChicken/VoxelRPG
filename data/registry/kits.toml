# Starting kits: what a new player has on their first spawn.
# Items go into the hotbar in order, then the pack. Change these
# freely while testing (F6 reloads; it applies to NEW players only).
#
#   player   the player's own inventory (Survival and Test Play),
#            also what a server gives a new player unless its
#            server.toml has its own starter_kit
#   dev      the Test Play dev inventory (dev tools)
#
# Each entry is an item name, or { item = "name", count = n }.
# Weapons equip into the first weapon slot, armour is worn.

[player]
items = [
  "builders_hammer",
  "hoe",              # terrain: level, raise, lower, path (T changes mode)
  "blast_wand",       # explosions, for testing destruction
  "windburst",        # spellbooks: in combat, the X slot (1) casts; 4 steps to the next
  "ice_spike",
  "grappling_hook",   # goes in B (combat) by itself: pull to grapple points, swing (hold), lunge at enemies
  # the spell groundwork's books (spells.toml), one of every delivery and use
  "book_firebolt", "book_spark_fan", "book_arc_beam", "book_frost_nova", "book_frost_rune",
  "book_shocking_grasp", "book_spore_cloud", "book_stone_wall", "book_call_mushnubs",
  "book_mending", "book_bark_skin", "book_blink", "book_ember_aura",
  "iron_sword",
  "wooden_shield",    # the off hand of both loadouts: Q / LT guards with it
  "iron_axe",
  "spear",
  "quarterstaff",
  "wooden_club",
  "stone_pickaxe",
  "iron_shovel",
  "leather_jerkin",
  { item = "torch", count = 16 },
]

[dev]
items = [
  "dev_wand", "dev_fill", "dev_brush", "dev_copy",
  "dev_paste", "dev_cube", "dev_explode", "builders_hammer", "dev_portal_gun",
]
