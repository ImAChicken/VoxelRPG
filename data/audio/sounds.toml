# Recorded sounds (audio/AudioEngine.h SfxBank): which .ogg files play
# for a kind of sound on a material, instead of the sound made in code
# (audio/Sfx.h, data/audio/materials.toml). Anything not named here is
# still made in code.
#
#   [<kind>.<material>]   kind: step land break place chop hit block
#                         swing cast door blast splash; material: a
#                         blocks.toml material (stone, dirt, wood, …),
#                         or "any" for every material without its own
#   files   in data/audio/sfx, one picked at random each time. With 4
#           or more, a big blow (a heavy hit) takes from the second
#           half of the list and a small one from the first, so list
#           the light ones first
#   gain    how loud, × the file (they're all near full scale)
#
# The files are from Kenney's Impact Sounds and RPG Audio (CC0:
# data/audio/sfx/LICENSE_Kenney.txt). (Claude, 2026-11-22)

[hit.dirt]   # a blow on a body (people: the game asks for dirt)
