# Blueprint: a building made of build pieces (game/Blueprint.h).
# Saved by the hammer's Copy tab; placed from its Blueprints tab and
# by the village generator. Each part: its structure type, the low
# corner of its box from the blueprint's low corner, its turn; a made
# piece (wall, post, door) its own sizes and blocks (spec); chests
# also keep items, or a loot table rolled when placed.
#   front: the side the door faces, 0 north, 1 east, 2 south, 3 west

