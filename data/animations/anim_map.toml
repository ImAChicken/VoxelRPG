# ══════════════════════════════════════════════════════════
# Which animation clip plays for what (character/AnimMap.h)
# ══════════════════════════════════════════════════════════
# Names are clip names (or "<pack>/<name>") from
# data/animations/ — the Character screen's Animations tab plays
# every clip, so you can pick from there. A state left out, or a
# name that isn't there, falls back to the built-in procedural
# animation. F6 reloads this file.
#
#   use_clips   false: everything procedural (the old look)
use_clips = true

[locomotion]
idle          = "Idle_Loop"
walk          = "Walk_Loop"
run           = "Jog_Fwd_Loop"
sprint        = "Sprint_Loop"
crouch_idle   = "Crouch_Idle_Loop"
crouch_walk   = "Crouch_Fwd_Loop"
combat_idle   = "Sword_Idle"
air_up        = "Jump_Start"
air_down      = "Jump_Loop"
roll          = "Roll"
guard         = "Sword_Block"

# How fast (vox/s) the body moves when each moving clip plays at
# its normal speed (measured from the packs' root-motion
# versions). A clip plays faster or slower to match the real
# speed, so feet don't slide (within 0.5×–2×).
[speeds]
walk        = 9.6
run         = 52.7
sprint      = 81.2
crouch_walk = 7.4

# Where one moving clip hands over to the next (vox/s, blended
# over 'blend' either side). The player walks at 30 and sprints
# at 50 (Human::WALK_SPEED, SPRINT_SPEED), NPCs often slower.
[switch]
walk_to_run   = 18.0
run_to_sprint = 46.0
blend         = 5.0

# Moveset attacks (movesets.toml ids) → clips.
#   id = "Clip"                                   stretched evenly over the attack
#   id = { clip = "Clip", strike = [from, to] }   'strike' marks where the clip's
#        blade actually swings (fractions of the clip, 0..1); the clip is played
#        so that part fills the moveset's hit window ('active'), the wind-up before
#        it and the recovery after it. Only the blade during the hit window hits
#        (game/CombatHits.h), so the marks are what make hits land when the blade
#        is seen to swing. tests/hit_test.cpp checks each mark: the blade is
#        fastest inside it.
# Attacks not listed keep their keyed poses.
[attacks]
sword_light1    = { clip = "Sword_Regular_A", strike = [0.45, 0.65] }   # low right, across, up to the left
sword_light2    = { clip = "Sword_Regular_B", strike = [0.36, 0.57] }   # left to right
sword_heavy     = { clip = "Sword_Regular_C", strike = [0.30, 0.38] }   # overhead, down in front
sword_air_light = { clip = "Sword_Dash",      strike = [0.16, 0.26] }
axe_light       = { clip = "Sword_Regular_A", strike = [0.45, 0.65] }
axe_heavy       = { clip = "Sword_Regular_C", strike = [0.30, 0.38] }
club_light1     = { clip = "Sword_Regular_A", strike = [0.45, 0.65] }
club_light2     = { clip = "Sword_Regular_B", strike = [0.36, 0.57] }
club_heavy      = { clip = "Sword_Regular_C", strike = [0.30, 0.38] }
spear_thrust    = { clip = "Punch_Cross",     strike = [0.17, 0.30] }   # the right fist drives straight out
spear_lunge     = { clip = "Punch_Cross",     strike = [0.17, 0.30] }
staff_light1    = { clip = "Sword_Regular_A", strike = [0.45, 0.65] }
staff_light2    = { clip = "Sword_Regular_B", strike = [0.36, 0.57] }
staff_light3    = { clip = "Sword_Regular_C", strike = [0.30, 0.38] }
staff_sweep     = { clip = "Sword_Regular_A", strike = [0.45, 0.65] }   # low and wide (band 0-8)
windburst_cast  = { clip = "Spell_Simple_Shoot", strike = [0.35, 0.55] }   # both hands thrust out: the wind goes
