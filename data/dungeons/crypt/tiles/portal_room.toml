# A dungeon tile (dungeon/Tile.h, docs/dungeons.md): a blueprint whose
# voxels are in the .vxvol beside it. Edit it in game: tile edit portal_room

name = "portal_room"
display = "portal_room"
tags = ["dungeon", "crypt", "portal_room"]
size = [96, 32, 96]
voxels = "portal_room.vxvol"

[tile]   # a dungeon tile (dungeon/Tile.h)
theme = "crypt"
kind = "portal_room"
cells = [6, 2, 6]   # half cells of 16 voxels
weight = 1
min = 1
max = 1
sockets = [
  { cell = [2, 0, 5], face = "s", type = "door" },
]

[[tile.marker]]
at = [48, 2, 30]
kind = "portal"
