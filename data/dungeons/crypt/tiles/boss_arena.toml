# A dungeon tile (dungeon/Tile.h, docs/dungeons.md): a blueprint whose
# voxels are in the .vxvol beside it. Edit it in game: tile edit boss_arena

name = "boss_arena"
display = "boss_arena"
tags = ["dungeon", "crypt", "boss"]
size = [128, 64, 128]
voxels = "boss_arena.vxvol"

[tile]   # a dungeon tile (dungeon/Tile.h)
theme = "crypt"
kind = "boss"
cells = [8, 4, 8]   # half cells of 16 voxels
weight = 1
min = 1
max = 1
sockets = [
  { cell = [3, 0, 7], face = "s", type = "door" },
]

[[tile.marker]]
at = [12, 2, 24]
kind = "coffin"
rule = "phase"
spawn = "undead"

[[tile.marker]]
at = [12, 2, 64]
kind = "coffin"
rule = "boss"
spawn = "undead"

[[tile.marker]]
