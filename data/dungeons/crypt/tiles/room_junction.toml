# A dungeon tile (dungeon/Tile.h, docs/dungeons.md): a blueprint whose
# voxels are in the .vxvol beside it. Edit it in game: tile edit room_junction

name = "room_junction"
display = "room_junction"
tags = ["dungeon", "crypt", "room"]
size = [64, 32, 64]
voxels = "room_junction.vxvol"

[tile]   # a dungeon tile (dungeon/Tile.h)
theme = "crypt"
kind = "room"
cells = [4, 2, 4]   # half cells of 16 voxels
weight = 1
sockets = [
  { cell = [1, 0, 0], face = "n", type = "door" },
  { cell = [3, 0, 2], face = "e", type = "door" },
  { cell = [2, 0, 3], face = "s", type = "door" },
  { cell = [0, 0, 1], face = "w", type = "door" },
]

[[tile.marker]]
at = [20, 2, 44]
kind = "spawner"
count = "2 3"
rule = "enter"
spawn = "undead"
