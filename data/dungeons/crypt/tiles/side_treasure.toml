# A dungeon tile (dungeon/Tile.h, docs/dungeons.md): a blueprint whose
# voxels are in the .vxvol beside it. Edit it in game: tile edit side_treasure

name = "side_treasure"
display = "side_treasure"
tags = ["dungeon", "crypt", "side"]
size = [64, 32, 64]
voxels = "side_treasure.vxvol"

[tile]   # a dungeon tile (dungeon/Tile.h)
theme = "crypt"
kind = "side"
cells = [4, 2, 4]   # half cells of 16 voxels
weight = 1
sockets = [
  { cell = [2, 0, 3], face = "s", type = "door" },
]

[[tile.marker]]
at = [32, 2, 4]
kind = "chest"

[[tile.marker]]
at = [32, 2, 36]
kind = "spawner"
count = "3 5"
rule = "enter"
spawn = "undead"
