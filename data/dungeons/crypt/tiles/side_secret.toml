# A dungeon tile (dungeon/Tile.h, docs/dungeons.md): a blueprint whose
# voxels are in the .vxvol beside it. Edit it in game: tile edit side_secret

name = "side_secret"
display = "side_secret"
tags = ["dungeon", "crypt", "side"]
size = [48, 32, 48]
voxels = "side_secret.vxvol"

[tile]   # a dungeon tile (dungeon/Tile.h)
theme = "crypt"
kind = "side"
cells = [3, 2, 3]   # half cells of 16 voxels
weight = 0.5
max = 2
sockets = [
  { cell = [1, 0, 2], face = "s", type = "door" },
]

[[tile.marker]]
at = [24, 2, 4]
kind = "chest"
