# A dungeon tile (dungeon/Tile.h, docs/dungeons.md): a blueprint whose
# voxels are in the .vxvol beside it. Edit it in game: tile edit room_gallery

name = "room_gallery"
display = "room_gallery"
tags = ["dungeon", "crypt", "room"]
size = [48, 32, 128]
voxels = "room_gallery.vxvol"

[tile]   # a dungeon tile (dungeon/Tile.h)
theme = "crypt"
kind = "room"
cells = [3, 2, 8]   # half cells of 16 voxels
weight = 0.8
sockets = [
  { cell = [1, 0, 0], face = "n", type = "door" },
  { cell = [1, 0, 7], face = "s", type = "door" },
]

[[tile.marker]]
at = [1, 2, 19]
kind = "coffin"
rule = "enter"
spawn = "undead"

