# A dungeon tile (dungeon/Tile.h, docs/dungeons.md): a blueprint whose
# voxels are in the .vxvol beside it. Edit it in game: tile edit corridor_straight

name = "corridor_straight"
display = "corridor_straight"
tags = ["dungeon", "crypt", "corridor"]
size = [16, 32, 32]
voxels = "corridor_straight.vxvol"

[tile]   # a dungeon tile (dungeon/Tile.h)
theme = "crypt"
kind = "corridor"
cells = [1, 2, 2]   # half cells of 16 voxels
weight = 3
sockets = [
  { cell = [0, 0, 0], face = "n", type = "door" },
  { cell = [0, 0, 1], face = "s", type = "door" },
]
