# A dungeon tile (dungeon/Tile.h, docs/dungeons.md): a blueprint whose
# voxels are in the .vxvol beside it. Edit it in game: tile edit stair_down

name = "stair_down"
display = "stair_down"
tags = ["dungeon", "crypt", "stair"]
size = [16, 64, 64]
voxels = "stair_down.vxvol"

[tile]   # a dungeon tile (dungeon/Tile.h)
theme = "crypt"
kind = "stair"
cells = [1, 4, 4]   # half cells of 16 voxels
weight = 1
max = 3
sockets = [
  { cell = [0, 0, 3], face = "s", type = "door" },
  { cell = [0, 2, 0], face = "n", type = "door" },
]
