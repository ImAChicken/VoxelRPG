# A dungeon tile (dungeon/Tile.h, docs/dungeons.md): a blueprint whose
# voxels are in the .vxvol beside it. Edit it in game: tile edit room_pillars

name = "room_pillars"
display = "room_pillars"
tags = ["dungeon", "crypt", "room"]
size = [96, 48, 96]
voxels = "room_pillars.vxvol"

[tile]   # a dungeon tile (dungeon/Tile.h)
theme = "crypt"
kind = "room"
cells = [6, 3, 6]   # half cells of 16 voxels
weight = 0.8
sockets = [
  { cell = [2, 0, 0], face = "n", type = "door" },
  { cell = [3, 0, 5], face = "s", type = "door" },
]

[[tile.marker]]
at = [48, 2, 48]
kind = "spawner"
count = "3 5"
rule = "enter"
spawn = "undead"

[[tile.marker]]
at = [80, 2, 80]
kind = "spawner"
count = "1 2"
rule = "enter"
spawn = "skeleton_archer"
