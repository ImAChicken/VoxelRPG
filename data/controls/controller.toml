# VoxelRPG Controller Bindings
# Standard gamepad layout
# Buttons: A, B, X, Y, LB, RB, L3, R3, START, SELECT
# Triggers: LT, RT (also act as axes)
# Sticks: LEFT_STICK_X, LEFT_STICK_Y,
#         RIGHT_STICK_X, RIGHT_STICK_Y
# D-pad: DPAD_UP, DPAD_DOWN, DPAD_LEFT, DPAD_RIGHT

[movement]
move_forward  = "LEFT_STICK_Y_NEG"
move_backward = "LEFT_STICK_Y_POS"
strafe_left   = "LEFT_STICK_X_NEG"
strafe_right  = "LEFT_STICK_X_POS"
jump          = "A"
crouch        = "L3"               # left stick click
sprint        = "LEFT_STICK"       # push stick fully
roll          = "B"                # tap = roll

[actions]
use_left        = "RT"             # right trigger = attack / place
use_right       = "LT"            # left trigger = secondary / remove
block           = "LB"             # left bumper = guard / timed block
draw_weapon     = "DPAD_RIGHT"     # draw / sheathe weapon
interact        = "X"
ledge_grab      = "L3"             # left stick click
inventory       = "SELECT"
toolbar_next    = "RB"
toolbar_prev    = "DPAD_LEFT"

[camera]
look_up         = "RIGHT_STICK_Y_NEG"
look_down       = "RIGHT_STICK_Y_POS"
look_left       = "RIGHT_STICK_X_NEG"
look_right      = "RIGHT_STICK_X_POS"
camera_toggle   = "R3"             # right stick click

[dev]
toggle_fly      = "Y"
toggle_debug    = "SELECT+START"   # chord
toggle_console  = "SELECT"
gamemode_cycle  = "DPAD_UP"

[system]
pause           = "START"
screenshot      = "DPAD_DOWN"
