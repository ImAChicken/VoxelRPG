# VoxelRPG Keyboard + Mouse Controls
# Edit this file to rebind any action
# Keys use names like W, A, S, D, SPACE, LEFT_SHIFT etc
# Mouse: MOUSE_LEFT, MOUSE_RIGHT, MOUSE_MIDDLE
# Scroll: MOUSE_SCROLL_UP, MOUSE_SCROLL_DOWN
# No recompile needed after editing

[movement]
move_forward  = "W"
move_backward = "S"
strafe_left   = "A"
strafe_right  = "D"
jump          = "SPACE"
crouch        = "LEFT_CONTROL"
sprint        = "LEFT_SHIFT"
roll          = "LEFT_SHIFT"        # tap = roll, hold = sprint

[actions]
use_left        = "MOUSE_LEFT"      # primary action / attack / place
use_right       = "MOUSE_RIGHT"     # secondary action / remove
block           = "Q"               # hold = guard, tap = timed block
draw_weapon     = "R"               # toggle draw/sheathe
                                    # switches survival <-> combat mode
interact        = "E"               # use / open / talk
ledge_grab      = "F"               # burst to face, hang, press again = lift
inventory       = "I"               # open the inventory (50 slots + equipment)
swap_weapon     = "X"               # switch between weapon 1 and weapon 2
lock_on         = "TAB"             # hold the camera on an enemy; flick the mouse sideways to switch
toolbar_next    = "MOUSE_SCROLL_DOWN"   # main-hand hotbar slots 3..10
toolbar_prev    = "MOUSE_SCROLL_UP"
toolbar_slot_1  = "1"               # off-hand slot 1: in the left hand / out
toolbar_slot_2  = "2"               # off-hand slot 2
toolbar_slot_3  = "3"               # main-hand hotbar slots
toolbar_slot_4  = "4"
toolbar_slot_5  = "5"
toolbar_slot_6  = "6"
toolbar_slot_7  = "7"
toolbar_slot_8  = "8"
toolbar_slot_9  = "9"
toolbar_slot_10 = "0"
rotate_piece    = "T"              # Builder's Hammer: turn the structure

[camera]
camera_toggle  = "F5"              # first person <-> third person

[dev]
toggle_fly      = "V"              # fly mode on/off (dev mode only)
toggle_debug    = "F3"             # debug overlay
toggle_console  = "GRAVE"          # ` key — dev console
gamemode_cycle  = "F4"             # cycle gamemodes
reload_registry = "F6"             # hot reload blocks.toml + items.toml
reload_pack     = "F7"             # hot reload resource pack
pick_block      = "MOUSE_MIDDLE"   # copy the block you look at into the toolbar
undo            = "Z"              # undo the last dev edit
redo            = "Y"              # redo
brush_bigger    = "EQUAL"          # = : dev brush / explosion bigger
brush_smaller   = "MINUS"          # - : dev brush / explosion smaller
nudge_forward   = "UP"             # paste tool: move away   brush/explosion: bigger
nudge_back      = "DOWN"           # paste tool: move closer brush/explosion: smaller
nudge_left      = "LEFT"           # paste tool: move left
nudge_right     = "RIGHT"          # paste tool: move right
nudge_up        = "PAGE_UP"        # paste tool: move up
nudge_down      = "PAGE_DOWN"      # paste tool: move down
tool_cancel     = "BACKSPACE"      # release a locked paste / cancel a prompt

[system]
pause           = "ESCAPE"
screenshot      = "F2"
